services:
  postgres:
    image: postgres:16-alpine
    container_name: raiseup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raiseup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raiseup}
      POSTGRES_DB: ${POSTGRES_DB:-raiseup}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raiseup} -d ${POSTGRES_DB:-raiseup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    container_name: raiseup-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-raiseup}:${POSTGRES_PASSWORD:-raiseup}@postgres:5432/${POSTGRES_DB:-raiseup}?sslmode=disable}",
        "up",
      ]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raiseup-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-raiseup}:${POSTGRES_PASSWORD:-raiseup}@postgres:5432/${POSTGRES_DB:-raiseup}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-10}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_GALLERY_BUCKET: ${SUPABASE_GALLERY_BUCKET:-gallery}
      SUPABASE_GALLERY_MAX_UPLOAD_BYTES: ${SUPABASE_GALLERY_MAX_UPLOAD_BYTES:-10485760}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    ports:
      - "${API_HOST_PORT:-8080}:8080"

volumes:
  postgres_data:
